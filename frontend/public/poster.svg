<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520">
  <defs>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <circle cx="300" cy="250" r="230" fill="url(#bgCircle)"/>

  <!-- Floating book (top-left) -->
  <g transform="translate(95,90) rotate(-12)">
    <rect x="0" y="0" width="58" height="42" rx="4" fill="#FFFFFF" stroke="#0A0D14" stroke-width="3"/>
    <line x1="29" y1="0" x2="29" y2="42" stroke="#0A0D14" stroke-width="2.5"/>
    <line x1="6" y1="12" x2="24" y2="12" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="21" x2="24" y2="21" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="30" x2="24" y2="30" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="12" x2="52" y2="12" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="21" x2="52" y2="21" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="30" x2="52" y2="30" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating checkmark badge (top-right) -->
  <g transform="translate(465,75)">
    <circle cx="0" cy="0" r="30" fill="#0A0D14"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#A78BFA" stroke-width="3"/>
    <path d="M-13,0 L-3,11 L15,-11" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating star -->
  <g transform="translate(510,225)">
    <path d="M0,-16 L4.5,-5 L16,-4 L7,4 L9.5,16 L0,9.5 L-9.5,16 L-7,4 L-16,-4 L-4.5,-5 Z" fill="#A78BFA"/>
  </g>

  <!-- Floating pencil -->
  <g transform="translate(75,330) rotate(20)">
    <rect x="0" y="0" width="14" height="60" rx="3" fill="#FFFFFF" stroke="#0A0D14" stroke-width="3"/>
    <path d="M0,0 L7,-16 L14,0 Z" fill="#7C3AED" stroke="#0A0D14" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="48" width="14" height="12" fill="#0A0D14"/>
  </g>

  <!-- Chair back (peeking out beside the torso, lower down) -->
  <rect x="228" y="345" width="144" height="16" rx="8" fill="#5B21B6"/>

  <!-- Person: torso (legs hidden behind desk) -->
  <path d="M242,420 C242,335 262,288 300,288 C338,288 358,335 358,420 Z" fill="url(#shirtGrad)"/>

  <!-- Head (skin) -->
  <circle cx="300" cy="235" r="34" fill="#C4B5FD"/>
  <!-- Hair — clipped to the head circle so it always follows its curve exactly -->
  <clipPath id="headClip"><circle cx="300" cy="235" r="34"/></clipPath>
  <g clip-path="url(#headClip)">
    <rect x="260" y="196" width="80" height="28" fill="#0A0D14"/>
  </g>
  <!-- Neck -->
  <rect x="288" y="258" width="24" height="20" rx="8" fill="#C4B5FD"/>

  <!-- Desk (drawn after torso so lower body hides behind it) -->
  <rect x="120" y="392" width="360" height="18" rx="6" fill="url(#deskGrad)"/>
  <rect x="140" y="410" width="20" height="68" fill="#5B21B6"/>
  <rect x="440" y="410" width="20" height="68" fill="#5B21B6"/>

  <!-- Open notebook, sitting on top of desk -->
  <g transform="translate(215,368)">
    <path d="M0,26 C20,14 60,14 80,26 L80,42 C60,30 20,30 0,42 Z" fill="#FFFFFF" stroke="#0A0D14" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80,26 C100,14 140,14 160,26 L160,42 C140,30 100,30 80,42 Z" fill="#FFFFFF" stroke="#0A0D14" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20,25 L45,29 M20,32 L40,35" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M140,25 L115,29 M140,32 L120,35" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Arms reaching down to the notebook, drawn in front of desk -->
  <path d="M262,340 C250,360 250,380 268,398" fill="none" stroke="url(#shirtGrad)" stroke-width="20" stroke-linecap="round"/>
  <path d="M338,340 C350,360 350,380 332,398" fill="none" stroke="url(#shirtGrad)" stroke-width="20" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="268" cy="400" r="10" fill="#C4B5FD"/>
  <circle cx="332" cy="400" r="10" fill="#C4B5FD"/>

  <!-- Small brand shield badge, bottom-center (subtle signature) -->
  <g transform="translate(300,478) scale(0.32)" opacity="0.9">
    <path d="M0,-72 L76,-44 L76,24 C76,72 42,100 0,113 C-42,100 -76,72 -76,24 L-76,-44 Z" fill="#7C3AED"/>
    <path d="M-19,-2 L-9,9 L19,-22" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
